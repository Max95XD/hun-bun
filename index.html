<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Love Story ❤️</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="background"></div>

<div id="stars"></div>
<div id="hearts"></div>

<div class="container">

    <h1>💖 Our Love Questions 💖</h1>

    <div class="question-card">

        <h2>Question 1</h2>

        <p class="question">
            When did we first meet?
        </p>

        <button onclick="toggleAnswer(1)">
            Reveal Answer
        </button>

        <div id="answer1" class="answer">
            It was the best day of my life ❤️
        </div>

    </div>

    <div class="question-card">

        <h2>Question 2</h2>

        <p class="question">
            Who says "I love you" first?
        </p>

        <button onclick="toggleAnswer(2)">
            Reveal Answer
        </button>

        <div id="answer2" class="answer">
            You do 🥰
        </div>

    </div>

    <div class="question-card">

        <h2>Question 3</h2>

        <p class="question">
            What is our favorite memory?
        </p>

        <button onclick="toggleAnswer(3)">
            Reveal Answer
        </button>

        <div id="answer3" class="answer">
            Every moment together ❤️
        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
